[project]
name = "minimum-sw-agent"
version = "0.1.0"
description = "A minimal software engineering agent built step by step"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
